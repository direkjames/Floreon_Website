# Netlify settings – no build step, the site is plain HTML/CSS/JS.
[build]
  publish = "."

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Cache CSS/JS/images for an hour (short, so updates show up quickly).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Keep the database setup file off the live site.
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
